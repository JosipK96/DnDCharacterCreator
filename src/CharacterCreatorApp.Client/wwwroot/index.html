<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D&D Character Creator</title>
    <base href="/" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div class="min-h-screen flex items-center justify-center bg-gray-900">
            <div class="text-center">
                <svg class="inline-block animate-spin h-12 w-12 text-indigo-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-white text-lg">Loading...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none;" class="bg-red-600 text-white p-4 fixed bottom-0 left-0 right-0 z-50">
        An unhandled error has occurred.
        <a href="" class="underline ml-2">Reload</a>
        <a class="float-right cursor-pointer" onclick="document.getElementById('blazor-error-ui').style.display='none'">✖</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/dice-box-loader.js"></script>
    <script src="js/save-file.js"></script>
</body>

</html>

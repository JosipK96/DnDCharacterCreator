<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D&D Character Creator</title>
    <base href="/" />

    <!-- Built from Styles/app.css by Tailwind at build time (Tailwind.targets) -->
    <link rel="stylesheet" href="css/app.css" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#233140" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Characters" />
</head>

<body>
    <div id="app">
        <div class="min-h-screen flex items-center justify-center">
            <div class="room px-10 py-8 text-center">
                <svg class="inline-block animate-spin h-12 w-12 text-plum mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="font-display font-semibold text-2xl text-ink">Loading...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert" style="display: none;"
         class="fixed bottom-0 left-0 right-0 z-50 flex items-center gap-3 bg-red-tint border-l-[5px] border-red px-4 py-3 text-red-text">
        <span class="flex-1">An unhandled error has occurred.</span>
        <a href="" class="font-display font-semibold underline">Reload</a>
        <button type="button" class="font-display font-semibold" aria-label="Dismiss"
                onclick="document.getElementById('blazor-error-ui').style.display='none'">&times;</button>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/dice-box-loader.js"></script>
    <script src="js/save-file.js"></script>
    <script src="js/app-update.js"></script>
    <script>
        // updateViaCache none: the worker file itself is always checked against the network
        if ('serviceWorker' in navigator) {
            window.swRegistration = navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
        }
    </script>
</body>

</html>

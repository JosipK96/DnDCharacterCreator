version: 2
updates:
  # Central package management: every version is in Directory.Packages.props
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # xunit.v3 and its Visual Studio runner only work at the same version, so they move
      # together (a group matches before the next one is tried)
      xunit:
        patterns: ["xunit*"]
      # Patch and minor updates come as one pull request a month
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The app targets .NET 10, and every .NET release brings majors of its packages that
      # need the new framework. A major update, .NET's or a library's, is a decision made by
      # hand in its own issue, not a pull request left open until someone closes it (#120).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Held at 1.2.0-beta.556: 1.3 adds rules (SA1315, SA1115) the code does not follow yet,
      # and warnings are errors, so its pull request can never pass CI. Move it by hand,
      # with the fixes, in its own issue (#120).
      - dependency-name: StyleCop.Analyzers
      # Held at 12.4.1 (CLAUDE.md). 13 and later need a paid or registered license, and
      # 12.5.0 changes the pipeline delegate to take a
      # cancellation token, which the behaviours do not pass yet. Move it by hand.
      - dependency-name: MediatR

  # One pull request for all of them: they edit neighbouring lines of the same workflow,
  # so separate ones conflict with each other after the first is merged
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

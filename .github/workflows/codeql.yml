# Reads the C# code for security flaws (injection, unsafe deserialization, missing authorization,
# secrets in code) and reports to the repository's Security tab. Separate from ci.yml, whose job
# names branch protection requires; this scan is not a required check.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays 03:17 UTC, so new queries also run against code that has not changed
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # Reads the source without building it, so the scan needs no SDK install
          # shortcut: a build would resolve more of the code, switch to manual if alerts are missed.
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

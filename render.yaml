# Render Blueprint for the hosted app (#31, #42): Render's free web service, with the database
# on Neon's free plan. In the Render dashboard: New > Blueprint, pick this repository, and paste
# the three secrets when asked. The README's Hosting section has the whole setup.
services:
  - type: web
    name: charactercreator
    runtime: docker
    plan: free
    # Same region as the Neon project (AWS Frankfurt); it can't be changed after creation
    region: frankfurt
    # Build context the repository root: the restore needs Directory.*.props and analyzers/
    dockerfilePath: ./src/CharacterCreatorApp.Api/Dockerfile
    dockerContext: .
    branch: main
    # Deploy a push to main only once CI on that commit has passed
    autoDeployTrigger: checksPass
    # Migrations and the reference data load run before Kestrel listens, and a failure stops
    # the process, so a broken deploy never passes this and the previous one keeps serving
    healthCheckPath: /health
    envVars:
      # The aspnet image listens on 8080; this tells Render to route there
      - key: PORT
        value: "8080"
      # From configurations/Env_files/api.env, which Render doesn't read. The other log levels
      # there are already appsettings.json's defaults.
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command
        value: Warning
      # Secrets: Render asks for these once, when the Blueprint is created, and keeps them in
      # the dashboard (service > Environment). They are never in this repository.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtSettings__Key
        sync: false
      - key: Registration__InviteCode
        sync: false
